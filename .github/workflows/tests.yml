name: Tests

permissions:
  contents: read

on: [push, pull_request]

jobs:
  tests:
    name: Tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        experimental: [false]
        composer-options: ['']
        include:
          - php: '8.2'
            analysis: true
          - php: '8.6'
            experimental: true
            composer-options: '--ignore-platform-req=php+'
          - php: nightly
            experimental: true
            composer-options: '--ignore-platform-req=php+'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:2.8

      - name: Install dependencies with Composer
        run: composer update --prefer-dist --no-progress --no-interaction --ansi ${{ matrix.composer-options }}

      - name: Coding standards
        if: matrix.analysis
        run: vendor/bin/phpcs

      - name: Static analysis
        if: matrix.analysis
        run: vendor/bin/phpstan

      - name: Tests
        run: vendor/bin/phpunit ${{ matrix.analysis && '--coverage-clover clover.xml' || '--no-coverage'  }}

      - name: Upload coverage results to Coveralls
        if: matrix.analysis
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          flag-name: php-${{ matrix.php }}
          files: clover.xml
